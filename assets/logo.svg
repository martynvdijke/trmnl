<!-- TRMNL monorepo logo — e-ink device + plugin grid -->
<!-- Concept: TRMNL device silhouette (rounded bezel) + inner e-paper screen with -->
<!-- "trmnl" wordmark and a 3×3 plugin glyph grid. 1-bit black/white + warm paper tone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">TRMNL — homelab plugins</title>
  <desc id="desc">Rounded e-ink device frame with inner screen showing trmnl wordmark and plugin grid</desc>
  <!-- bezel -->
  <rect x="12" y="12" width="376" height="376" rx="28" ry="28" fill="#0B0B0C"/>
  <!-- inner screen -->
  <rect x="28" y="28" width="344" height="344" rx="18" ry="18" fill="#FDFBF5" stroke="#111" stroke-width="2"/>
  <!-- paper texture dots (subtle) -->
  <g opacity="0.06">
    <circle cx="80" cy="80" r="1" fill="#000"/><circle cx="120" cy="70" r="1"/><circle cx="300" cy="90" r="1"/><circle cx="340" cy="140" r="1"/><circle cx="60" cy="320" r="1"/><circle cx="320" cy="340" r="1"/>
  </g>
  <!-- header rule -->
  <rect x="48" y="52" width="304" height="48" rx="10" fill="#0B0B0C"/>
  <text x="72" y="82" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="800" letter-spacing="-1.5" fill="#FDFBF5">trmnl</text>
  <text x="272" y="78" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.8" fill="#9A9A9A">MONOREPO</text>
  <text x="272" y="90" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" letter-spacing="0.6" fill="#6B6B6B">19 PLUGINS • E-INK</text>

  <!-- divider -->
  <line x1="48" y1="112" x2="352" y2="112" stroke="#111" stroke-width="1.2" opacity="0.12"/>

  <!-- 3x3 plugin glyph grid -->
  <g transform="translate(48,128)">
    <!-- cell bg -->
    <g id="cells">
      <rect x="0" y="0" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="106" y="0" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="212" y="0" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="0" y="80" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="106" y="80" width="92" height="68" rx="10" fill="#0B0B0C" stroke="#0B0B0C" stroke-width="1.4"/>
      <rect x="212" y="80" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="0" y="160" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="106" y="160" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
      <rect x="212" y="160" width="92" height="68" rx="10" fill="white" stroke="#111" stroke-width="1.4"/>
    </g>
    <!-- glyphs: camera (immich) -->
    <g transform="translate(46,34)">
      <rect x="-14" y="-8" width="28" height="18" rx="3" fill="none" stroke="#111" stroke-width="1.6"/>
      <circle cx="0" cy="1" r="6" fill="none" stroke="#111" stroke-width="1.6"/>
      <rect x="8" y="-12" width="8" height="4" rx="1" fill="#111"/>
    </g>
    <!-- film (jellyfin) -->
    <g transform="translate(152,34)">
      <rect x="-16" y="-12" width="32" height="24" rx="3" fill="none" stroke="#111" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#111" stroke-width="1.4"/>
      <circle cx="-10" cy="-7" r="1.6" fill="#111"/><circle cx="-10" cy="7" r="1.6" fill="#111"/><circle cx="10" cy="-7" r="1.6" fill="#111"/><circle cx="10" cy="7" r="1.6" fill="#111"/>
    </g>
    <!-- book (mealie/booklore) -->
    <g transform="translate(258,34)">
      <path d="M -12 -12 L 0 -10 L 12 -12 L 12 12 L 0 10 L -12 12 Z" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#111" stroke-width="1.2"/>
      <line x1="-6" y1="-5" x2="-3" y2="-5" stroke="#111" stroke-width="1" opacity="0.5"/><line x1="-6" y1="-1" x2="-3" y2="-1" stroke="#111" stroke-width="1" opacity="0.5"/>
    </g>
    <!-- shield (adguard) -->
    <g transform="translate(46,114)">
      <path d="M 0 -12 L 12 -6 L 10 10 L 0 14 L -10 10 L -12 -6 Z" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M -5 1 L 0 6 L 6 -4" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- inverted center: grid/e-ink (TRMNL) -->
    <g transform="translate(152,114)">
      <rect x="-14" y="-10" width="28" height="20" rx="2" fill="none" stroke="#FDFBF5" stroke-width="1.4"/>
      <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#FDFBF5" stroke-width="1"/><line x1="0" y1="-10" x2="0" y2="10" stroke="#FDFBF5" stroke-width="1"/>
      <circle cx="-7" cy="4" r="2.2" fill="#FDFBF5"/><circle cx="7" cy="4" r="2.2" fill="none" stroke="#FDFBF5" stroke-width="1.1"/>
      <text x="0" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="5.5" font-weight="700" letter-spacing="0.8" fill="#FDFBF5">TRMNL</text>
    </g>
    <!-- graph (opencode) -->
    <g transform="translate(258,114)">
      <rect x="-14" y="-10" width="28" height="20" rx="2" fill="none" stroke="#111" stroke-width="1.4"/>
      <polyline points="-10,6 -4, -2 0,4 5,-6 10,2" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="5" cy="-6" r="2" fill="#111"/>
    </g>
    <!-- dice (boardgamegeek) -->
    <g transform="translate(46,194)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="none" stroke="#111" stroke-width="1.6"/>
      <circle cx="-6" cy="-6" r="1.8" fill="#111"/><circle cx="6" cy="6" r="1.8" fill="#111"/><circle cx="0" cy="0" r="1.8" fill="#111"/><circle cx="6" cy="-6" r="1.8" fill="#111"/><circle cx="-6" cy="6" r="1.8" fill="#111"/>
    </g>
    <!-- disk (scrutiny/backrest) -->
    <g transform="translate(152,194)">
      <ellipse cx="0" cy="-2" rx="12" ry="6" fill="none" stroke="#111" stroke-width="1.4"/>
      <path d="M -12 -2 L -12 6 C -12 9.5 -6 12 0 12 C 6 12 12 9.5 12 6 L 12 -2" fill="none" stroke="#111" stroke-width="1.4"/>
      <ellipse cx="0" cy="6" rx="12" ry="6" fill="none" stroke="#111" stroke-width="1.1" opacity="0.5"/>
    </g>
    <!-- rss (freshrss/wallabag) -->
    <g transform="translate(258,194)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="none" stroke="#111" stroke-width="1.4"/>
      <path d="M -8 8 A 14 14 0 0 1 8 -8" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -8 3 A 9 9 0 0 1 3 -8" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="-8" cy="8" r="2" fill="#111"/>
    </g>
  </g>

  <!-- footer -->
  <text x="200" y="348" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="2.2" fill="#6B6B6B">HOMELAB  •  E-INK  •  PLUGINS</text>
</svg>
