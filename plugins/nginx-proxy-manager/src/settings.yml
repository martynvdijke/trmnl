id: 450316
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/tokens"
polling_headers: Content-Type=application/json
polling_body: '{"identity":"{{username}}","secret":"{{password}}"}'
id: 450316
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of Nginx Proxy Manager
  field_type: url
  description: The base URL of your Nginx Proxy Manager instance
  placeholder: https://npm.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: username
  name: NPM Username
  field_type: text
  description: Your Nginx Proxy Manager login email
  placeholder: admin@example.com
  help_text: The email you use to sign in to NPM
- keyname: password
  name: NPM Password
  field_type: password
  description: Your Nginx Proxy Manager password
  placeholder: Your password
  help_text: Stored securely and only sent to your NPM instance
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I run Nginx Proxy Manager, this shows my SSL certificate expiry at a glance.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Nginx Proxy Manager
description: NPM SSL cert expiry
refresh_interval: 1440
