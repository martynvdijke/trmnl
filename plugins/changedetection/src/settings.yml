---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/v1/watch"
polling_headers: 'x-api-key={{api_key}}'
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of the changedetection.io server
  field_type: url
  description: The base URL of your changedetection.io instance
  placeholder: https://changedetection.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: api_key
  name: API Key
  field_type: text
  description: changedetection.io API key
  placeholder: ""
  help_text: "Create in changedetection.io: Settings > API Keys"
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I use changedetection.io to monitor websites, this shows which watched pages have changed.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Changedetection
description: Website change monitoring
refresh_interval: 360
