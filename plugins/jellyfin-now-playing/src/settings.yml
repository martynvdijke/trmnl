custom_fields:
- keyname: url
  name: Address of the Jellyfin server
  field_type: url
  description: The base URL of your Jellyfin server
  placeholder: https://jellyfin.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: api_key
  name: Jellyfin API Key
  field_type: text
  description: API key for your Jellyfin server
  placeholder: Your Jellyfin API key
  help_text: 'Create one in Jellyfin: Dashboard > API Keys. An admin key is recommended so all sessions are visible.'
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I run a Jellyfin server, this shows what is currently streaming on my TV with poster art.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Jellyfin Now Playing
description: Now playing on Jellyfin
refresh_interval: 60
