---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/statistics/"
polling_headers: 'Authorization=Token {{api_token}}'
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of the Paperless-ngx server
  field_type: url
  description: The base URL of your Paperless-ngx instance
  placeholder: https://paperless.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: api_token
  name: API Token
  field_type: text
  description: Paperless-ngx API token
  placeholder: ""
  help_text: "Create in Paperless-ngx: Admin > Users & Tokens"
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: Shows Paperless-ngx inbox and library document counts and recent documents.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Paperless-ngx
description: Paperless inbox and library
refresh_interval: 360
