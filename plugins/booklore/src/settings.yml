id: 450310
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/books?page=0&size=1"
polling_headers: Authorization=Bearer {{api_key}}
polling_body: ''
id: 450310
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of Booklore
  field_type: url
  description: The base URL of your Booklore instance
  placeholder: https://booklore.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: api_key
  name: Booklore API Key
  field_type: text
  description: API key for your Booklore instance
  placeholder: Your Booklore API key
  help_text: 'Create one in Booklore: Settings > API'
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I manage my books in Booklore, this shows my library size and what I am reading.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Booklore
description: Booklore library & reading
refresh_interval: 1440
