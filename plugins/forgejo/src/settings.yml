id: 450315
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/v1/user/issues?state=open&type=pr"
polling_headers: Authorization=token {{api_key}}
polling_body: ''
id: 450315
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of the Forgejo instance
  field_type: url
  description: The base URL of your Forgejo instance
  placeholder: https://forgejo.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: api_key
  name: Forgejo API Token
  field_type: text
  description: API token for your Forgejo instance
  placeholder: Your Forgejo API token
  help_text: 'Create one in Forgejo: Settings > Applications > Generate Token'
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I am running Forgejo, this shows my open PRs, issues and CI status on my trmnl.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Forgejo PRs & CI
description: Forgejo PRs, issues & CI
refresh_interval: 360
