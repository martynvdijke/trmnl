id: 450308
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/greader.php/accounts/ClientLogin"
polling_headers: Content-Type=application/x-www-form-urlencoded
polling_body: email={{username}}&password={{password}}
id: 450308
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of FreshRSS
  field_type: url
  description: The base URL of your FreshRSS instance
  placeholder: https://freshrss.example.com
  help_text: Please include the protocol (e.g. http or https)
- keyname: username
  name: FreshRSS Username
  field_type: text
  description: Your FreshRSS login email
  placeholder: user@example.com
  help_text: The email you use to sign in to FreshRSS
- keyname: password
  name: FreshRSS Password
  field_type: password
  description: Your FreshRSS password
  placeholder: Your password
  help_text: Stored securely and only sent to your FreshRSS instance
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I read RSS feeds in FreshRSS, this shows my unread count at a glance.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: FreshRSS
description: FreshRSS unread count
refresh_interval: 360
