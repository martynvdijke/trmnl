---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "https://boardgamegeek.com/xmlapi2/plays?username={{username}}&count=10"
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: username
  name: BoardGameGeek username
  field_type: text
  description: Your BoardGameGeek username
  placeholder: your_bgg_username
  help_text: Used to load your plays and owned collection from BoardGameGeek.
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I track board games on BoardGameGeek, this shows my latest plays and a game from my collection.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: BoardGameGeek
description: 'Latest plays & a game you own'
refresh_interval: 3600
