id: 450305
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: "{{url}}/api/sessions?sort=updatedAt&collapsed=true&itemsPerPage=20"
polling_headers: Authorization=Bearer {{api_key}}
polling_body: ''
id: 450305
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  name: Address of the Audiobookshelf server
  field_type: url
  description: The base URL of your Audiobookshelf server
  placeholder: http://audiobookshelf.example.com:13378
  help_text: Please include the protocol (e.g. http or https) and port
- keyname: api_key
  name: Audiobookshelf API Key
  field_type: text
  description: API key / token for your Audiobookshelf server
  placeholder: Your Audiobookshelf API token
  help_text: 'Create one in Audiobookshelf: Config > Users > API Tokens'
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I am running Audiobookshelf, this shows what I am currently listening to on my trmnl.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Audiobookshelf Listening
description: Now playing on Audiobookshelf
refresh_interval: 60
