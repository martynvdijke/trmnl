custom_fields:
- keyname: url
  name: Address of the Sonarr/Radarr server
  field_type: url
  description: The base URL of your Sonarr or Radarr server
  placeholder: https://sonarr.example.com
  help_text: Please include the protocol (e.g. http or https). Works with both Sonarr and Radarr.
- keyname: api_key
  name: API Key
  field_type: text
  description: API key for your Sonarr or Radarr server
  placeholder: Your API key
  help_text: 'Create one in Sonarr/Radarr: Settings > General > API Key'
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I run Sonarr and Radarr, this shows what is releasing in the next two weeks with poster art.
  github_url: https://github.com/martynvdijke/trmnl
  learn_more_url: https://github.com/martynvdijke/trmnl
  email_address: martyn@vandijke.xyz
name: Coming Soon
description: Upcoming Sonarr & Radarr
refresh_interval: 1440
